name: Coverage-guided parser fuzzing

on:
  pull_request:
    paths:
      - ".github/workflows/coverage-guided-fuzz.yml"
      - "fuzz/coverage-guided/**"
      - "scripts/run-coverage-guided-fuzz.mjs"
      - "scripts/lib/coverage-guided-corpus.mjs"
      - "skills/rivet/scripts/lib/security-evidence.mjs"
      - "skills/rivet/scripts/lib/fuzz.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/coverage-guided-fuzz.yml"
      - "fuzz/coverage-guided/**"
      - "scripts/run-coverage-guided-fuzz.mjs"
      - "scripts/lib/coverage-guided-corpus.mjs"
      - "skills/rivet/scripts/lib/security-evidence.mjs"
      - "skills/rivet/scripts/lib/fuzz.mjs"
  schedule:
    - cron: "15 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-guided-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Jazzer.js parser campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fuzz/coverage-guided/package-lock.json

      - name: Require the selected revision
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$EXPECTED_REVISION" = "$(git rev-parse HEAD)"

      - name: Install the isolated fuzz workspace
        run: npm ci --prefix fuzz/coverage-guided

      - name: Restore the trusted persistent corpus
        id: restore-corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .rivet/persistent-coverage-guided-corpus
          key: rivet-jazzer-corpus-v1-${{ runner.os }}-${{ hashFiles('fuzz/coverage-guided/package-lock.json') }}-${{ github.run_id }}
          restore-keys: rivet-jazzer-corpus-v1-${{ runner.os }}-${{ hashFiles('fuzz/coverage-guided/package-lock.json') }}-

      - name: Run the bounded coverage-guided campaign
        run: >-
          node scripts/run-coverage-guided-fuzz.mjs
          --executions 10000
          --workspace .rivet/coverage-guided
          --persistent-corpus .rivet/persistent-coverage-guided-corpus
          --output .rivet/coverage-guided/report.json

      - name: Save the trusted persistent corpus
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .rivet/persistent-coverage-guided-corpus
          key: ${{ steps.restore-corpus.outputs.cache-primary-key }}

      - name: Retain report, corpus, and crash inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rivet-coverage-guided-fuzz
          path: .rivet/coverage-guided
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
