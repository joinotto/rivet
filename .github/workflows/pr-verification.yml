name: Rivet PR verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rivet-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend risk and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build the Rivet report
        env:
          RIVET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RIVET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RIVET_REPORT_DIR: .rivet/ci
        run: node scripts/run-pr-verification.mjs

      - name: Retain the Rivet report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rivet-pr-${{ github.event.pull_request.number }}-report
          path: .rivet/ci
          if-no-files-found: error
          retention-days: 14
