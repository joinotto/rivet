name: Native signature fixture

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-signature.yml"
      - "fixtures/native-signature/**"
      - "skills/rivet/scripts/rivet-evidence.mjs"

permissions:
  contents: read

jobs:
  cosign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Create ephemeral key and sign SBOM
        shell: bash
        env:
          COSIGN_PASSWORD: rivet-fixture-only
        run: |
          mkdir -p .rivet/ci
          cosign generate-key-pair --output-key-prefix .rivet/ci/cosign
          cosign signing-config create \
            --no-default-fulcio \
            --no-default-oidc \
            --no-default-rekor \
            --no-default-tsa \
            --out .rivet/ci/offline-signing-config.json
          cosign sign-blob \
            --yes \
            --key .rivet/ci/cosign.key \
            --bundle .rivet/ci/bom.bundle.json \
            --signing-config .rivet/ci/offline-signing-config.json \
            fixtures/native-signature/bom.json

      - name: Verify signed SBOM through Rivet
        shell: bash
        run: |
          node skills/rivet/scripts/rivet-evidence.mjs sbom \
            --file fixtures/native-signature/bom.json \
            --revision "$GITHUB_SHA" \
            --signature cosign-key \
            --bundle .rivet/ci/bom.bundle.json \
            --key-file .rivet/ci/cosign.pub > /tmp/rivet-signature.json
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(
              fs.readFileSync("/tmp/rivet-signature.json", "utf8")
            );
            if (
              report.decision !== "verified" ||
              report.signature_validation?.result !== "valid"
            ) {
              console.error(JSON.stringify(report, null, 2));
              process.exit(1);
            }
          '
