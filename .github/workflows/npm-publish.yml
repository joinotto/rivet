name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed version (initial stable exception 0.1.3 or a preview)
        required: true
        type: string
      revision:
        description: Full commit identifier of the selected main revision
        required: true
        type: string
      channel:
        description: Registry channel for the reviewed release
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'joinotto/rivet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false

      - name: Require exact reviewed release source
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
          SOURCE_VERSION: ${{ inputs.version }}
          SOURCE_CHANNEL: ${{ inputs.channel }}
        run: |
          test "$SOURCE_REVISION" = "$GITHUB_SHA"
          test "$SOURCE_REVISION" = "$(git rev-parse HEAD)"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const metadata = JSON.parse(fs.readFileSync("package.json", "utf8"));
          assert.match(process.env.SOURCE_REVISION, /^[a-f0-9]{40}$/);
          assert.equal(metadata.name, "@ottoai/rivet");
          assert.equal(metadata.version, process.env.SOURCE_VERSION);
          assert.ok(["next", "latest"].includes(process.env.SOURCE_CHANNEL));
          assert.equal(metadata.publishConfig.tag, process.env.SOURCE_CHANNEL);
          assert.equal(metadata.publishConfig.provenance, true);
          if (process.env.SOURCE_CHANNEL === "next") {
            assert.match(process.env.SOURCE_VERSION, /^\d+\.\d+\.\d+-preview\.\d+$/);
          } else {
            // This exception does not authorize later stable versions.
            assert.equal(process.env.SOURCE_VERSION, "0.1.3",
              "Only the initial maintainer-approved stable exception is authorized.");
          }
          JS

      - name: Run checks without publishing permission
        run: |
          npm test
          npm run test:distribution
          npm run test:hosts
          npm run test:release
          npm run test:release-verification
          npm run validate:skill
          npm run check:dco

  publish:
    needs: check
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out checked revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false

      - name: Require unchanged source identity
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          test "$SOURCE_REVISION" = "$GITHUB_SHA"
          test "$SOURCE_REVISION" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

      - name: Install isolated publishing client
        run: |
          npm install --ignore-scripts --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/rivet-npm-cli" npm@12.2.1

      - name: Publish checked channel with OIDC and provenance
        env:
          PUBLISH_CHANNEL: ${{ inputs.channel }}
        run: |
          case "$PUBLISH_CHANNEL" in
            next|latest) ;;
            *) exit 1 ;;
          esac
          "$RUNNER_TEMP/rivet-npm-cli/node_modules/.bin/npm" publish \
            --ignore-scripts --access public --tag "$PUBLISH_CHANNEL" --provenance
