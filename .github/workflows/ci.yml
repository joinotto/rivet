name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE license compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - "16"
          - "22"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Require the selected revision
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$EXPECTED_REVISION" = "$(git rev-parse HEAD)"

      - name: Run behavioral tests
        run: npm test

      - name: Run host-package conformance
        run: npm run test:hosts

      - name: Run seeded evaluation
        run: npm run test:evaluation

      - name: Run bounded parser fuzzing
        run: npm run test:fuzz -- --output ".rivet/ci/parser-fuzz-node-${{ matrix.node }}.json"

      - name: Retain bounded parser fuzz evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rivet-parser-fuzz-node-${{ matrix.node }}
          path: .rivet/ci/parser-fuzz-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Test release-candidate reproducibility
        run: npm run test:release

      - name: Test release-candidate verification
        run: npm run test:release-verification

      - name: Validate skill package
        run: npm run validate:skill

      - name: Validate skill-change rejections
        run: npm run validate:rejections

      - name: Validate OpenSSF baseline assessment
        run: npm run validate:openssf

      - name: Validate open-source foundation
        run: npm run validate:foundation

      - name: Check DCO sign-offs
        env:
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: npm run check:dco

      - name: Test skill-routing contract
        run: npm run test:routing

      - name: Check technical writing
        run: npm run check:ste
