name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - "16"
          - "22"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run behavioral tests
        run: npm test

      - name: Run host-package conformance
        run: npm run test:hosts

      - name: Run seeded evaluation
        run: npm run test:evaluation

      - name: Run bounded parser fuzzing
        run: npm run test:fuzz

      - name: Test release-candidate reproducibility
        run: npm run test:release

      - name: Validate skill package
        run: npm run validate:skill

      - name: Validate skill-change rejections
        run: npm run validate:rejections

      - name: Validate OpenSSF baseline assessment
        run: npm run validate:openssf

      - name: Check DCO sign-offs
        env:
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: npm run check:dco

      - name: Test skill-routing contract
        run: npm run test:routing

      - name: Check technical writing
        run: npm run check:ste
