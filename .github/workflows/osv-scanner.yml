name: OSV Scanner

on:
  merge_group:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-pr:
    name: Dependency vulnerability diff
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: true
      runs-on: ubuntu-24.04
