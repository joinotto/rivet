name: Unsigned release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a v prefix
        required: true
        type: string
      revision:
        description: Full lowercase commit identifier on the default branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-candidate-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and verify unsigned candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Require the selected default-branch revision
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          test "$EXPECTED_REVISION" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$EXPECTED_REVISION" origin/main

      - name: Build unsigned candidate
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          npm run package:release-candidate -- \
            --version "$CANDIDATE_VERSION" \
            --revision "$CANDIDATE_REVISION" \
            --output dist/release

      - name: Verify unsigned candidate
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          npm run verify:release-candidate -- \
            --input dist/release \
            --version "$CANDIDATE_VERSION" \
            --revision "$CANDIDATE_REVISION"

      - name: Retain candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rivet-${{ inputs.version }}-unsigned-candidate
          path: dist/release
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
