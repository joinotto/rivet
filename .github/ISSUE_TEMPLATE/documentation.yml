name: Documentation problem
description: Report unclear, incorrect, or missing Rivet documentation.
title: "[Docs] "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Document location
      description: Give the file, heading, command, or link.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is unclear, incorrect, or missing.
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: Consequence
      description: Explain the incorrect action or decision that a reader can make.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
    validations:
      required: false
